name: Prepare release
run-name: Prepare release ${{ inputs.version || 'next patch' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (blank selects next patch above package and tags)"
        required: false
        type: string
      notes:
        description: "Optional release notes, included as literal Markdown"
        required: false
        type: string

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      pr_number: ${{ steps.release.outputs.pr_number }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Release preparation must be dispatched from main" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Prepare release PR and dispatch CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          gh auth setup-git
          node scripts/prepare-release.mjs

  receipt:
    name: "Prepared release PR #${{ needs.prepare.outputs.pr_number }} v${{ needs.prepare.outputs.version }}"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record successful preparation identity
        run: echo "Preparation identity recorded in this workflow run's job name"
