name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (semver, without leading v)'
        required: false
      notes:
        description: 'Additional release notes (markdown)'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # This workflow bumps versions + tags the repo; keep it on main to avoid surprises.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify (lint, typecheck, test)
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            echo "Using manual override: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi
          PKG_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v$PKG_VERSION")
          BASE=${LAST_TAG#v}
          if [[ ! $BASE =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Warning: last tag '$LAST_TAG' not valid semver; falling back to package.json version $PKG_VERSION" >&2
            BASE=$PKG_VERSION
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          PATCH=$((PATCH+1))
          NEXT="$MAJOR.$MINOR.$PATCH"
          if [[ ! $NEXT =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: computed version '$NEXT' invalid" >&2
            exit 1
          fi
          echo "Auto increment patch: $LAST_TAG -> v$NEXT"
          echo "version=$NEXT" >> $GITHUB_OUTPUT

      - name: Show computed version
        run: |
          if [[ -z "${{ steps.version.outputs.version }}" ]]; then
            echo "Version missing" >&2; exit 1; fi
          if [[ ! "${{ steps.version.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semver: '${{ steps.version.outputs.version }}'" >&2; exit 1; fi
          echo "Version => ${{ steps.version.outputs.version }}"

      - name: Bump version in sources (main only, not for tag push)
        run: |
          if [[ -z "${{ steps.version.outputs.version }}" ]]; then echo "No version; abort" >&2; exit 1; fi
          node scripts/bump-version.cjs ${{ steps.version.outputs.version }}

      - name: Generate changelog
        run: |
          if [[ -z "${{ steps.version.outputs.version }}" ]]; then echo "No version; abort" >&2; exit 1; fi
          node scripts/generate-changelog.cjs ${{ steps.version.outputs.version }} --update

      - name: Append manual notes
        if: inputs.notes != ''
        shell: bash
        run: |
          echo "" >> CHANGELOG_RELEASE.md
          echo "### Additional Notes" >> CHANGELOG_RELEASE.md
          # Preserve line breaks from workflow_dispatch input
          printf '%s\n' "${{ inputs.notes }}" >> CHANGELOG_RELEASE.md

      - name: Commit changes
        shell: bash
        run: |
          if [[ ! "${{ steps.version.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to tag invalid version '${{ steps.version.outputs.version }}'" >&2; exit 1; fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          if git diff --quiet; then
            echo "Nothing to commit (working tree clean)"
          else
            git commit -am "chore: release v${{ steps.version.outputs.version }}"
          fi

      - name: Create local tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"

      - name: Build distributions
        run: npm run dist

      - name: Collect distributions
        run: |
          cp .output/*-chrome.zip opencc.chrome.zip
          cp .output/*-firefox.zip opencc.firefox.zip
          cp .output/*-edge.zip opencc.edge.zip

      - name: Generate checksums
        run: sha256sum opencc.chrome.zip opencc.firefox.zip opencc.edge.zip > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.version.outputs.version }}
          path: |
            opencc.chrome.zip
            opencc.firefox.zip
            opencc.edge.zip
            SHA256SUMS
          retention-days: 14

      - name: Push commit + tag
        shell: bash
        run: |
          git push
          git push --tags

      - name: Add checksum summary
        shell: bash
        run: |
          echo "### Artifact Checksums" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | SHA256 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          awk '{printf("| %s | `%s` |\n", $2, $1)}' SHA256SUMS >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false
          files: |
            opencc.chrome.zip
            opencc.firefox.zip
            opencc.edge.zip
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
