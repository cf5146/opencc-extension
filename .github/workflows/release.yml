name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (semver, without leading v)"
        required: false
      notes:
        description: "Additional release notes (markdown)"
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node_modules/.bin/wxt prepare

      - name: Verify (lint, typecheck, test, builds)
        run: npm --ignore-scripts run ci

  build-and-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node_modules/.bin/wxt prepare

      - name: Determine version
        id: version
        shell: bash
        run: node scripts/resolve-release-version.mjs
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Show computed version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo "Version missing" >&2; exit 1; fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semver" >&2; exit 1; fi
          echo "Version => $RELEASE_VERSION"

      - name: Bump version in sources
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$RELEASE_VERSION" ]]; then echo "No version; abort" >&2; exit 1; fi
          node scripts/bump-version.cjs "$RELEASE_VERSION"

      - name: Generate changelog
        if: steps.version.outputs.resumed != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$RELEASE_VERSION" ]]; then echo "No version; abort" >&2; exit 1; fi
          node scripts/generate-changelog.cjs "$RELEASE_VERSION" --update

      - name: Append manual notes
        if: inputs.notes != '' && steps.version.outputs.resumed != 'true'
        shell: bash
        run: |
          echo "" >> CHANGELOG_RELEASE.md
          echo "### Additional Notes" >> CHANGELOG_RELEASE.md
          # Preserve line breaks from workflow_dispatch input
          printf '%s\n' "$RELEASE_NOTES" >> CHANGELOG_RELEASE.md
        env:
          RELEASE_NOTES: ${{ inputs.notes }}

      - name: Verify final versioned artifacts
        run: npm --ignore-scripts run ci

      - name: Commit changes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to tag invalid version" >&2; exit 1; fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add package.json package-lock.json CHANGELOG.md CHANGELOG_RELEASE.md
          if git diff --cached --quiet; then
            echo "Nothing to commit (working tree clean)"
          else
            git commit -m "chore: release v$RELEASE_VERSION"
          fi

      - name: Create local tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$RELEASE_VERSION"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_COMMIT" != "$HEAD_COMMIT" ]]; then
              echo "Tag $TAG already exists at $TAG_COMMIT, expected $HEAD_COMMIT. Refusing to overwrite it." >&2
              echo "Recovery: restore main and the tag to the same commit, then rerun with version $RELEASE_VERSION." >&2
              exit 1
            fi
            echo "Tag $TAG already points to HEAD; resuming publication"
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi

      - name: Build distributions
        run: npm run dist

      - name: Generate checksums
        run: (cd .output && sha256sum opencc.chrome.zip opencc.firefox.zip opencc.edge.zip) > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifacts-${{ steps.version.outputs.version }}
          path: |
            .output/opencc.chrome.zip
            .output/opencc.firefox.zip
            .output/opencc.edge.zip
            SHA256SUMS
          retention-days: 14

      - name: Push commit + tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$RELEASE_VERSION"
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Add checksum summary
        shell: bash
        run: |
          echo "### Artifact Checksums" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | SHA256 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          awk '{printf("| %s | `%s` |\n", $2, $1)}' SHA256SUMS >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            .output/opencc.chrome.zip
            .output/opencc.firefox.zip
            .output/opencc.edge.zip
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
