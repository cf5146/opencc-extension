name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (semver)'
        required: false
      notes:
        description: 'Additional release notes'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "Using manual override: ${{ inputs.version }}"
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF##*/}"
            VERSION="${TAG_NAME#v}"
            echo "Using tag version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi
          PKG_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v$PKG_VERSION")
          BASE=${LAST_TAG#v}
          if [[ ! $BASE =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Warning: last tag '$LAST_TAG' not valid semver; falling back to package.json version $PKG_VERSION" >&2
            BASE=$PKG_VERSION
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          PATCH=$((PATCH+1))
          NEXT="$MAJOR.$MINOR.$PATCH"
          if [[ ! $NEXT =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: computed version '$NEXT' invalid" >&2
            exit 1
          fi
          echo "Auto increment patch: $LAST_TAG -> v$NEXT"
          echo "version=$NEXT" >> $GITHUB_OUTPUT

      - name: Show computed version
        run: |
          if [[ -z "${{ steps.version.outputs.version }}" ]]; then
            echo "Version missing" >&2; exit 1; fi
          echo "Version => ${{ steps.version.outputs.version }}"

      - name: Bump version in sources (main only, not for tag push)
        if: github.ref == 'refs/heads/main'
        run: |
          if [[ -z "${{ steps.version.outputs.version }}" ]]; then echo "No version; abort" >&2; exit 1; fi
          node scripts/bump-version.cjs ${{ steps.version.outputs.version }}

      - name: Generate changelog
        run: |
          if [[ -z "${{ steps.version.outputs.version }}" ]]; then echo "No version; abort" >&2; exit 1; fi
          node scripts/generate-changelog.cjs ${{ steps.version.outputs.version }} --update

      - name: Commit & tag (main only if changes)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          if [[ ! "${{ steps.version.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to tag invalid version '${{ steps.version.outputs.version }}'" >&2; exit 1; fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "chore: release v${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push --follow-tags

      - name: Build distributions
        run: pnpm dist

      - name: Generate checksums
        run: sha256sum opencc.chrome.zip opencc.firefox.zip opencc.edge.zip > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.version.outputs.version }}
          path: |
            opencc.chrome.zip
            opencc.firefox.zip
            opencc.edge.zip
            SHA256SUMS
          retention-days: 14

      - name: Add checksum summary
        shell: bash
        run: |
          echo "### Artifact Checksums" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | SHA256 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          awk '{printf("| %s | `%s` |\n", $2, $1)}' SHA256SUMS >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false
          files: |
            opencc.chrome.zip
            opencc.firefox.zip
            opencc.edge.zip
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
