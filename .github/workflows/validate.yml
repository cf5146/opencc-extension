name: Validate and build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      artifact_prefix:
        required: true
        type: string
      retention_days:
        required: true
        type: number
      release_version:
        default: ""
        type: string
    outputs:
      artifact_name:
        value: ${{ jobs.package.outputs.artifact_name }}
      version:
        value: ${{ jobs.package.outputs.version }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Validate workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node_modules/.bin/wxt prepare
      - name: Check source
        run: |
          npm --ignore-scripts run verify:official
          npm --ignore-scripts run lint
          npm --ignore-scripts run typecheck
          npm --ignore-scripts test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node_modules/.bin/wxt prepare
      - name: Build and verify browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          npm --ignore-scripts run "build:$BROWSER"
          node scripts/verify-build-output.mjs "$BROWSER"
          node scripts/verify-official-assets.mjs "$BROWSER"
      - name: Transfer verified build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ inputs.artifact_prefix }}-${{ matrix.browser }}-${{ github.run_id }}
          # Replace only this browser's intermediate output when failed jobs rerun.
          overwrite: true
          # Upload the parent so browser directories survive merged downloads.
          path: .output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  package:
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install packaging dependencies
        run: npm ci --ignore-scripts
      - name: Download verified browser builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-${{ inputs.artifact_prefix }}-*-${{ github.run_id }}
          path: .output/
          merge-multiple: true
      - name: Package verified builds
        run: npm --ignore-scripts run package:built
      - name: Prepare immutable release artifacts
        if: inputs.release_version != ''
        id: metadata
        run: node scripts/release-artifacts.mjs
        env:
          EXPECTED_VERSION: ${{ inputs.release_version }}
          GITHUB_SHA: ${{ inputs.source_ref }}
          GIT_EXECUTABLE: /usr/bin/git
      - name: Save artifact identity for retries
        id: artifact
        env:
          PREFIX: ${{ inputs.artifact_prefix }}
        run: echo "artifact_name=${PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload installable packages
        if: inputs.release_version == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: |
            .output/opencc.chrome.zip
            .output/opencc.firefox.zip
            .output/opencc.edge.zip
            .output/SHA256SUMS
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
      - name: Upload verified release artifacts
        if: inputs.release_version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: .output/release-artifacts/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
