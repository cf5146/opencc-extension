name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Package (Chrome, Firefox, Edge)
        run: pnpm dist
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webext-zips
          path: |
            opencc.chrome.zip
            opencc.firefox.zip
            opencc.edge.zip
          if-no-files-found: error
