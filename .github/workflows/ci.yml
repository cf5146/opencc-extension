name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node_modules/.bin/wxt prepare
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build Chrome
        run: npm run build:chrome
      - name: Verify Chrome artifact
        run: node scripts/verify-build-output.mjs chrome
      - name: Build Firefox
        run: npm run build:firefox
      - name: Verify Firefox artifact
        run: node scripts/verify-build-output.mjs firefox
      - name: Build Edge
        run: npm run build:edge
      - name: Verify Edge artifact
        run: node scripts/verify-build-output.mjs edge

  package:
    # Packaging is valuable but slower; run it on pushes (main/dev) so PR checks stay quick.
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node_modules/.bin/wxt prepare
      - name: Package (Chrome, Firefox, Edge)
        run: npm run dist
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webext-zips-${{ github.sha }}
          path: |
            .output/opencc.chrome.zip
            .output/opencc.firefox.zip
            .output/opencc.edge.zip
          if-no-files-found: error
