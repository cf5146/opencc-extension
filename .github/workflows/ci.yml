name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Preparation explicitly dispatches CI because GITHUB_TOKEN does not trigger PR runs.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/validate.yml
    with:
      artifact_prefix: ci
      retention_days: ${{ github.event_name == 'pull_request' && 7 || startsWith(github.ref, 'refs/heads/codex/release-v') && 7 || 14 }}

  verify:
    if: always()
    needs: [checks, official-parity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks and browser packages
        env:
          RESULT: ${{ needs.checks.result }}
          PARITY_RESULT: ${{ needs.official-parity.result }}
        run: test "$RESULT" = success && test "$PARITY_RESULT" = success

  official-parity:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/opencc-feasibility/package-lock.json
      - name: Install fixed native reference tools
        run: npm ci --prefix scripts/opencc-feasibility --ignore-scripts
      - name: Compare bundled engine against matching native OpenCC and Jieba
        run: node scripts/check-official-parity.mjs
