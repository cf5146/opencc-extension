name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Package (Chrome, Firefox, Edge)
        run: npm run dist
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webext-zips
          path: |
            opencc.chrome.zip
            opencc.firefox.zip
            opencc.edge.zip
          if-no-files-found: error
