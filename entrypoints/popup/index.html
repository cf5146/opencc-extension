<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>OpenCC</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div><strong>OpenCC</strong> <span id="subtitle"></span></div>
      <a href="/options.html" target="_blank">Settings</a>
    </header>
    <main>
      <section aria-labelledby="direction-title">
        <h1 id="direction-title">Chinese conversion</h1>
        <p class="hint">One global language pair for pages and text.</p>
        <div class="direction-row">
          <label
            >From<select id="origin">
              <option value="cn">Simplified Chinese</option>
              <option value="hk" title="Traditional Chinese — Hong Kong">Traditional — Hong Kong</option>
              <option value="tw" title="Traditional Chinese — Taiwan">Traditional — Taiwan</option>
              <option value="twp" title="Traditional Chinese — Taiwan vocabulary">Taiwan vocabulary</option>
            </select></label
          >
          <button id="swap" type="button" aria-label="Swap source and target" title="Swap source and target">⇄</button>
          <label
            >To<select id="target">
              <option value="hk" title="Traditional Chinese — Hong Kong">Traditional — Hong Kong</option>
              <option value="cn">Simplified Chinese</option>
              <option value="tw" title="Traditional Chinese — Taiwan">Traditional — Taiwan</option>
              <option value="twp" title="Traditional Chinese — Taiwan vocabulary">Taiwan vocabulary</option>
            </select></label
          >
        </div>
      </section>
      <section aria-labelledby="site-title">
        <h2 id="site-title">This site <span id="hostname"></span></h2>
        <label for="site-rule">Auto-conversion rule</label>
        <select id="site-rule">
          <option value="default">Use default</option>
          <option value="always">Always auto-convert</option>
          <option value="never">Never auto-convert</option>
        </select>
        <label class="checkbox"><input id="auto" type="checkbox" /> Auto-convert by default</label>
        <p id="policy" class="hint"></p>
      </section>
      <section aria-labelledby="text-title">
        <h2 id="text-title">Convert text</h2>
        <p class="hint">Text stays in this popup and is cleared when it closes.</p>
        <label for="textbox">Original</label>
        <textarea id="textbox" placeholder="Type or paste Chinese text…" spellcheck="false"></textarea>
        <label for="result">Result</label>
        <textarea id="result" readonly placeholder="Converted text appears here" spellcheck="false"></textarea>
        <div class="tools">
          <button id="copy" type="button">Copy result</button><button id="reset" type="button">Clear text</button>
        </div>
      </section>
    </main>
    <footer>
      <button id="convert" class="primary" type="button">Convert page</button>
      <output id="status" aria-live="polite"></output><button id="retry" type="button" hidden>Retry</button>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
