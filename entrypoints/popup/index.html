<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>OpenCC</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header><strong>OpenCC 1.4.2</strong><button id="show-settings" type="button">網站設定</button></header>
    <main>
      <section>
        <h1>中文轉換</h1>
        <label for="preset">官方轉換設定</label
        ><select id="preset"></select
        ><label for="mode">分詞方式</label
        ><select id="mode">
          <option value="jieba">Jieba</option>
          <option value="mmseg">mmseg</option>
        </select>
        <p class="hint">引擎與詞典皆在本機執行。Jieba 首次初始化可能需要數秒。</p>
      </section>
      <section id="migration" hidden>
        <p>已更新為官方轉換設定。舊版全域自動轉換與正規表示式規則已停用；舊資料仍保留，請逐站重新啟用。</p>
        <button id="dismiss" type="button">知道了</button>
      </section>
      <section>
        <h2>目前網站</h2>
        <p id="hostname"></p>
        <label class="checkbox"><input id="site-auto" type="checkbox" />對此主機名稱自動轉換</label>
        <p class="hint">只套用於完全相同的主機名稱，並儲存此站的轉換設定與分詞方式。</p>
      </section>
      <section>
        <h2>文字轉換</h2>
        <label for="textbox">原文</label
        ><textarea id="textbox" placeholder="輸入或貼上中文…" spellcheck="false"></textarea
        ><label for="result">轉換結果</label><textarea id="result" readonly spellcheck="false"></textarea>
        <div class="tools">
          <button id="copy" type="button" disabled>複製結果</button><button id="reset" type="button">清除文字</button>
        </div>
        <p class="hint">文字不會儲存，關閉視窗後清除。</p>
      </section>
    </main>
    <footer>
      <button id="convert" class="primary" type="button">轉換目前網頁</button
      ><output id="status" role="status" aria-live="polite"></output>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
