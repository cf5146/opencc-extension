<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCC 網站設定</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>網站自動轉換</h1>
      <p>
        在目標網站開啟
        OpenCC，選擇官方轉換設定與分詞方式，再勾選「對此主機名稱自動轉換」。每個網站個別儲存，不會套用至子網域。
      </p>
      <p>舊版全域自動轉換與正規表示式規則已停用，原始設定資料仍保留。變更設定後，已轉換的頁面需要重新載入。</p>
      <ul id="site-rules"></ul>
      <button id="retry" type="button">重新載入設定</button><output id="status" aria-live="polite"></output>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
